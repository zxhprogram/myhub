name: Build Windows App

# 将 nexus_hub_app（Flutter 前端）编译成 Windows 应用并上传构建产物。
# 推送 v* 标签时自动创建 GitHub Release 并附带压缩包。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    # softprops/action-gh-release 创建 Release 需要 contents 写权限。
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # windows/CMakeLists.txt 会把 windows/ 下的 Go c-shared DLL 安装到
      # runner exe 旁边，因此先编译 input_hook.dll / network_monitor.dll。
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: nexus_hub_app/windows/network_monitor/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 固定版本以保证 CI 可复现；本地 lockfile 要求 flutter >=3.44。
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Build Go DLLs
        shell: cmd
        working-directory: nexus_hub_app/windows
        run: build_hooks.bat

      - name: Pub get
        working-directory: nexus_hub_app
        # 强制使用仓库内 lockfile 的精确版本，lockfile 与 pubspec/代码
        # 不一致时在此步骤直接失败，避免编译期出现晦涩的 API 错误。
        run: flutter pub get --enforce-lockfile

      # cargokit 的 resolve_symlinks.ps1 逐级 Get-Item 解析插件符号链接，
      # 但 CI 上 pub cache 位于隐藏目录 AppData 下，缺少 -Force 会报
      # "Could not find item ... AppData"，导致 Rust 插件构建失败。打补丁修复。
      - name: Patch cargokit resolve_symlinks.ps1
        shell: pwsh
        run: |
          Get-ChildItem "$env:PUB_CACHE/hosted" -Recurse -Filter resolve_symlinks.ps1 |
            ForEach-Object {
              (Get-Content $_.FullName -Raw) -replace 'Get-Item \$realPath', 'Get-Item -Force $realPath' |
                Set-Content $_.FullName
              Write-Host "Patched: $($_.FullName)"
            }

      # 依赖了 flutter_alacritty（cargokit 构建 Rust 绑定），windows-latest
      # 镜像自带 Rust 工具链，无需额外安装。
      - name: Build Windows
        working-directory: nexus_hub_app
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        working-directory: nexus_hub_app
        run: |
          $out = "nexus_hub_app-windows-x64.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $out
          "NEXUS_HUB_ZIP=$out" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus_hub_app-windows-x64
          path: nexus_hub_app/nexus_hub_app-windows-x64.zip

      # v* 标签构建 → 正式 Release（沿用标签名）。
      - name: Release (stable)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nexus_hub_app/nexus_hub_app-windows-x64.zip

      # 手动/常规构建 → 自动发布为 build-N 预发布版本。
      - name: Release (prerelease)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Windows Build #${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: nexus_hub_app/nexus_hub_app-windows-x64.zip
