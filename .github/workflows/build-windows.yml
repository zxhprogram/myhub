name: Build Windows App

# 将 nexus_hub_app（Flutter 前端）编译成 Windows 应用并上传构建产物。
# 推送 v* 标签时自动创建 GitHub Release 并附带压缩包。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      # pubspec.lock 中的 hosted URL 是锁文件内容的一部分；CI 必须与其一致，
      # 否则普通 pub get 可能重新解析到 shadcn_flutter 0.0.54 等不兼容版本。
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      # 避免 Windows runner 默认 AppData 隐藏目录触发 cargokit 旧脚本 Get-Item 问题。
      PUB_CACHE: ${{ runner.temp }}\pub-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache-dependency-path: nexus_hub_app/windows/network_monitor/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 固定版本以保证 CI 可复现；pubspec.lock 要求 Flutter >=3.44.0。
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Verify toolchain
        working-directory: nexus_hub_app
        run: |
          flutter --version
          dart --version

      - name: Restore exact Dart packages
        working-directory: nexus_hub_app
        run: flutter pub get --enforce-lockfile

      - name: Analyze Dart API compatibility
        working-directory: nexus_hub_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # cargokit 的 resolve_symlinks.ps1 逐级 Get-Item 解析插件符号链接；
      # 对隐藏目录缺少 -Force 时会报 "Could not find item ... AppData"。
      # PUB_CACHE 已移出 AppData，这里仍保留补丁以兼容插件脚本后续路径变化。
      - name: Patch cargokit resolve_symlinks.ps1
        shell: pwsh
        run: |
          $scripts = Get-ChildItem "$env:PUB_CACHE\hosted" -Recurse -Filter resolve_symlinks.ps1 -ErrorAction SilentlyContinue
          foreach ($script in $scripts) {
            $content = Get-Content $script.FullName -Raw
            $patched = $content -replace 'Get-Item \$realPath', 'Get-Item -Force $realPath'
            if ($patched -ne $content) {
              Set-Content -Path $script.FullName -Value $patched -NoNewline
              Write-Host "Patched: $($script.FullName)"
            }
          }

      - name: Build Go DLLs
        shell: cmd
        working-directory: nexus_hub_app/windows
        run: build_hooks.bat

      - name: Build Windows
        working-directory: nexus_hub_app
        run: flutter build windows --release

      - name: Package Windows app
        shell: pwsh
        working-directory: nexus_hub_app
        run: |
          $out = "nexus_hub_app-windows-x64.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $out -Force
          "NEXUS_HUB_ZIP=$out" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus_hub_app-windows-x64
          path: nexus_hub_app/nexus_hub_app-windows-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nexus_hub_app/nexus_hub_app-windows-x64.zip
