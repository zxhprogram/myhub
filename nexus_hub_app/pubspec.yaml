name: nexus_hub_app
description: Nexus Hub Flutter frontend
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  signals_flutter: ^6.1.4
  go_router: ^14.8.1
  shadcn_flutter: ^0.0.53
  dio: ^5.8.0+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  shimmer: ^3.0.0
  equatable: ^2.0.7
  url_launcher: ^6.3.2
  fl_chart: ^0.70.2
  flutter_reorderable_grid_view: ^5.7.0
  super_clipboard: ^0.9.1
  flutter_quill: ^11.5.1
  diff_match_patch: ^0.4.1
  easy_mail: ^0.1.0
  shared_preferences: ^2.2.2
  flutter_inappwebview: ^6.1.5
  flutter_widget_from_html: ^0.17.2
  flutter_alacritty: ^2.4.0
  dartssh2: ^2.22.5
  camera: 0.12.0+2
  camera_windows: 0.2.6+4
  file_selector: ^1.0.3
  # java_decompiler:
 #   path: ../../java-decompiler
  java_decompiler: ^0.1.0
  # Native video playback (libmpv) for the Video sub-app. The official
  # video_player has no Windows implementation; media_kit covers Windows.
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  # AES-CBC decryption of the stream URL embedded in the cloud player page.
  pointycastle: ^4.0.0
  gpt_markdown: ^1.1.8
  # Ebook Reader sub-app: PDF rendering (PDFium, Windows supported).
  pdfrx: ^2.4.7
  # EPUB unpacking (pure Dart ZIP reader).
  archive: ^4.0.0
  # EPUB container.xml / OPF manifest parsing.
  xml: ^6.5.0
  # EPUB chapter XHTML DOM processing (lenient real-world HTML parsing).
  html: ^0.15.4
  # GBK fallback decoding for legacy Chinese TXT novels.
  fast_gbk: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Pin shadcn_flutter to a vendored, patched copy in `../third_party/shadcn_flutter`.
#
# The vendored copy ships the fix for controlled-window dragging (window would
# vanish from the desktop after the first drag) which is not yet in the
# published 0.0.53 package. Do not remove this override without re-applying
# the fix to the vendored copy (or confirming an upgraded shadcn_flutter
# already contains it). See `test/window_drag_test.dart`.
dependency_overrides:
  shadcn_flutter:
    path: ../third_party/shadcn_flutter

  # Vendored copy with two local patches:
  # 1. utils/log.h: suppress "dealloc ..." teardown logs that flood stdout
  #    whenever a WebView or the plugin itself is destroyed (e.g. closing
  #    the Google News sub-app window). Not addressed upstream as of v0.6.0.
  # 2. InAppWebViewManager: the static WinRT/COM members (RoHelper,
  #    dispatcher queue, GraphicsContext, compositor) are intentionally
  #    leaked raw pointers so their Release()/RoUninitialize() never run
  #    during DLL_PROCESS_DETACH, which otherwise raises an
  #    "Unknown Hard Error" dialog at app exit (upstream issue #2733,
  #    same approach as upstream PR #2838).
  # When upgrading flutter_inappwebview_windows, re-copy the new version
  # into third_party/ and re-apply both patches.
  flutter_inappwebview_windows:
    path: ../third_party/flutter_inappwebview_windows

flutter:
  uses-material-design: true
